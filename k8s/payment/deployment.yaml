apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: dytni
spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: payment-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8084

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secrets

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084

            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084

            initialDelaySeconds: 45
            periodSeconds: 10