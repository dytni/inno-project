apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dytni
data:
  SPRING_PROFILES_ACTIVE: docker

  AUTH_SERVICE_PORT: "8081"
  USER_SERVICE_PORT: "8082"
  ORDER_SERVICE_PORT: "8083"
  PAYMENT_SERVICE_PORT: "8084"
  GATEWAY_PORT: "8085"


  AUTH_SERVICE_URL: http://auth-service:8081
  USER_SERVICE_URL: http://user-service:8082
  ORDER_SERVICE_URL: http://order-service:8083
  PAYMENT_SERVICE_URL: http://payment-service:8084

  KAFKA_BOOTSTRAP_SERVER: kafka:9092

  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

  MONGO_URI: mongodb://mongo-db:27017/payment_db

  POSTGRES_USER_URL: jdbc:postgresql://postgres:5432/user_service
  POSTGRES_AUTH_URL: jdbc:postgresql://postgres:5432/auth_service
  POSTGRES_ORDER_URL: jdbc:postgresql://postgres:5432/order_service