apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: dytni
spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8082

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secrets

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082

            initialDelaySeconds: 20
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082

            initialDelaySeconds: 30
            periodSeconds: 10