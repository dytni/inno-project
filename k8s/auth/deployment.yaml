apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dytni
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: auth-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: app-config

            - secretRef:
                name: app-secrets

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_AUTH_URL

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3